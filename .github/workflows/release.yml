name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            artifact: voxless-macos-arm64.dmg
            asset_glob: dist/*.dmg
          - os: windows-latest
            artifact: voxless-windows-x64.zip
            asset_glob: dist/*.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.13"

      - name: Sync deps
        run: uv sync --no-editable --extra build

      - name: Render icons
        run: uv run python scripts/build_icons.py

      - name: Build app (PyInstaller)
        run: uv run pyinstaller voxless.spec --noconfirm --clean

      - name: Package macOS DMG
        if: runner.os == 'macOS'
        run: |
          set -euxo pipefail
          mkdir -p dist/dmg
          cp -R dist/voxless.app dist/dmg/
          ln -s /Applications dist/dmg/Applications
          hdiutil create -volname voxless \
            -srcfolder dist/dmg \
            -ov -format UDZO \
            dist/voxless-macos-arm64.dmg
          rm -rf dist/dmg

      - name: Package Windows zip
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path dist/voxless -DestinationPath dist/voxless-windows-x64.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.asset_glob }}
          if-no-files-found: error

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
          draft: false
          prerelease: false
