[project]
name = "voxless"
version = "0.1.10"
description = "Local Typeless clone — push-to-talk dictation with Whisper + Ollama"
requires-python = ">=3.11"
authors = [{ name = "Luis Miguel" }]
dependencies = [
    "faster-whisper>=1.0.3",
    "sounddevice>=0.4.7",
    "numpy>=1.26",
    "soundfile>=0.12.1",
    "pynput>=1.7.7",
    "pyperclip>=1.9.0",
    "httpx>=0.27.0",
    "pydantic>=2.7",
    "PySide6-Essentials>=6.7.0",
    "pyobjc-framework-AVFoundation>=10.0; sys_platform == 'darwin'",
]

[project.scripts]
voxless = "voxless.__main__:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-mock>=3.14",
]
build = [
    "pyinstaller>=6.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voxless"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
